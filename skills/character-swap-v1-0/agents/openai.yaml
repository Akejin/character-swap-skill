interface:
  display_name: "移形换影 · Character Swap v1.0"
  short_description: "把场景照片里的人物替换成人物样片中的人：样貌服饰取自样片，表情视线动作与面部光影复刻场景原人物"
  default_prompt: "Use $character-swap-v1-0 to replace the person in the first image (scene) with the person from the second image (identity sample), keeping the scene, pose, expression, gaze, and facial lighting unchanged."
